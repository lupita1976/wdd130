<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles/quiz.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <div class="quiz-box">
            <form action="#" method="post">
                <div class="question">
                    <label for="q1">1 Fill in the blank: The ____ element is used to define the main
                        heading of an HTML page.</label>
                    <input type="text" id="q1" name="q1">
                </div>
                <div class="question">
                    <label for="q2">2.In your own words, briefly explain the difference between an
                        <code>id</code> and a
                        <code>class</code> attribute in HTML</label>
                    <textarea name="q2" id="q2" rows="4"></textarea>

                </div>
                <div class="question">
                    <label for="q3">3. Which CSS property is used to change the text color of an
                        element?</label>
                    <select name="q3" id="q3">
                        <option value="" selected disabled>choose one</option>
                        <option value="color">color</option>
                        <option value="background-color">background-color</option>
                        <option value="font-color">font-color</option>
                    </select>

                </div>
                <button type="submit">submit quiz</button>

            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 | HTML &amp; CSS Quiz Activity | Guadalupe Fernandez</p>
    </footer>

</body>

</html>
